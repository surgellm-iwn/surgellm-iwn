[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "surgellm"
version = "1.0.0"
description = "SURGeLLM: task-aware feature gating with class-balanced normalization (TrustNLP 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Noor Islam S. Mohammad"},
  {name = "Ulug Bayazit"},
]
keywords = ["multi-task learning", "NLP", "class imbalance", "feature gating",
            "authorship detection", "trustworthy NLP"]
dependencies = ["torch>=2.0", "numpy>=1.23", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
paper = ["transformers>=4.35", "datasets>=2.14", "accelerate>=0.24",
         "sentence-transformers>=2.2", "scikit-learn>=1.3", "scipy>=1.10"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["surgellm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests that train a model (tens of seconds)"]
filterwarnings = ["ignore::UserWarning"]
